    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch ? function() {
            return originalFetch.apply(window, arguments);
          } : undefined;

          // Define setter and getter on window so extensions and proxies can reassign window.fetch without errors
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return customFetch;
                  },
                  set: function(val) {
                    customFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch proxy initialization:', e);
        }
      })();
    </script>
